{% extends "base.html" %}
{% block content %}

<h3 class="mb-4">❤️ Saved Rooms</h3>

<div class="row">

{% for fav, room in favorites %}

<div class="col-md-4 mb-4">

    <div class="card shadow-sm h-100">

        {% set imgs = room.images.split(',') if room.images else [] %}

        {% if imgs %}
        <img
            src="{{ url_for('static', filename='uploads/rooms/' + imgs[0]) }}"
            class="card-img-top"
            style="height:220px; object-fit:cover;">
        {% endif %}

        <div class="card-body">

            <h5>{{ room.area }}</h5>

            <p class="text-muted">
                {{ room.city }}
            </p>

            <h6 class="text-success">
                Rs. {{ room.rent }}
            </h6>

            <a href="/room/{{ room.id }}"
               class="btn btn-primary">
                View Details
            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
